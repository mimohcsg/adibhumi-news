<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ई-पेपर | आदिभूमि</title>
  <meta name="description" content="आदिभूमि दैनिक ई-पेपर — दिन भर की खबरें, कटऑफ रात 11:59।">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="epaper-page">
  <header class="epaper-toolbar no-print">
    <div class="container epaper-toolbar-inner">
      <a class="brand" href="index.html" aria-label="आदिभूमि होम">
          <img class="brand-mark" src="assets/adibhumi-logo.png" width="46" height="46" alt="" />
          <span class="brand-text">
            <span class="brand-hi">आदिभूमि</span>
            <span class="brand-en">E-PAPER · WEST MP</span>
          </span>
      </a>
      <div class="epaper-actions">
        <label class="epaper-date-label">
          <span>तारीख</span>
          <select id="epaperDate"></select>
        </label>
        <button type="button" class="btn btn-ghost" id="epaperLang">EN</button>
        <button type="button" class="btn btn-primary" id="epaperPrint">प्रिंट / PDF</button>
        <a class="btn btn-ghost" href="index.html">होम</a>
      </div>
    </div>
  </header>

  <main class="epaper-sheet container" id="epaperRoot" aria-busy="true">
    <p class="epaper-loading" id="epaperLoading">ई-पेपर तैयार हो रहा है…</p>
  </main>

  <script src="epaper.js"></script>
</body>
</html>
